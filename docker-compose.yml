services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor_ie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctor_ie
      POSTGRES_PASSWORD: doctor_ie
      POSTGRES_DB: doctor_ie
    ports:
      - "5433:5432"
    volumes:
      - ./docker/pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_ie -d doctor_ie"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: doctor_ie_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Chave fixa para persistir tokens entre restarts (dev).
      APP_KEY: base64:2mF0m3qk7cJ8pQ9rTdWbXyZ1aB2cD3eF4gH5iJ6kL7M=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: doctor_ie
      DB_USERNAME: doctor_ie
      DB_PASSWORD: doctor_ie
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # A URL e resolvida no navegador do usuario, entao aponta para o host.
        API_BASE_URL: http://localhost:8000/api
    container_name: doctor_ie_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
